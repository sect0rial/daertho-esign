# Quick start:  cp .env.example .env  (set ESIGN_SECRET)  →  docker compose up -d  →  open http://localhost:8000
# The first-run page asks for a setup token: ESIGN_SETUP_TOKEN from .env, or, if that is empty, the one in
#   docker compose logs esign | grep "Setup token"
services:
  esign:
    build: .
    image: daertho-esign:latest
    restart: unless-stopped
    env_file: .env
    # Published on this machine only. Put a reverse proxy with HTTPS in front (Caddy, nginx) and set
    # ESIGN_TRUST_PROXY=1 in .env so the app records the visitor's address instead of the proxy's.
    # To publish the port directly instead, use "8000:8000" and leave ESIGN_TRUST_PROXY=0.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - esign-data:/data

  # Optional Postgres instead of the built-in SQLite file. Uncomment, then set in .env:
  #   ESIGN_DATABASE_URL=postgresql://esign:change-me@db:5432/esign
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: esign
  #     POSTGRES_PASSWORD: change-me
  #     POSTGRES_DB: esign
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

volumes:
  esign-data:
  # pg-data:
